plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.takattowo.usercabridge'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.takattowo.usercabridge'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            if (keystorePath) {
                storeFile = file(keystorePath)
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS')
                keyPassword = System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
