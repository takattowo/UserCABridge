name: Build APKs

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secret; release uses a generated debug key, matching the old module fallback."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"
      - name: Test, lint, and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Verify APK metadata and signature
        run: |
          python3 - <<'PY'
          import os, re, subprocess, zipfile
          for variant in ('debug', 'release'):
              apk_path = f'app/build/outputs/apk/{variant}/app-{variant}.apk'
              aapt = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0', 'aapt')
              manifest = subprocess.check_output(
                  [aapt, 'dump', 'xmltree', apk_path, 'AndroidManifest.xml'], text=True)
              assert 'StatusActivity' in manifest
              providers = re.findall(r'(?ms)^[ \t]*E: provider\b.*?(?=^[ \t]*E:|\Z)', manifest)
              trust_provider = next((item for item in providers
                                     if 'TrustReportProvider' in item), None)
              assert trust_provider is not None, f'TrustReportProvider missing: {providers!r}'
              assert 'io.github.takattowo.usercabridge.trustreports' in trust_provider, trust_provider
              assert re.search(r'android:grantUriPermissions\([^)]*\)=.*(?:true|0xffffffff)',
                               trust_provider), trust_provider
              assert 'android:writePermission' in trust_provider, trust_provider
              assert 'io.github.takattowo.usercabridge.permission.WRITE_REPORT' in trust_provider, trust_provider
              permissions = re.findall(r'(?ms)^[ \t]*E: permission\b.*?(?=^[ \t]*E:|\Z)', manifest)
              report_permission = next((item for item in permissions
                                        if 'io.github.takattowo.usercabridge.permission.WRITE_REPORT' in item), None)
              assert report_permission is not None, f'WRITE_REPORT permission missing: {permissions!r}'
              assert 'android:protectionLevel' in report_permission, report_permission
              xposed_provider = next((item for item in providers
                                      if 'XposedProvider' in item), None)
              assert xposed_provider is not None, f'XposedProvider missing: {providers!r}'
              assert 'android.permission.INTERACT_ACROSS_USERS' in xposed_provider, xposed_provider
              assert 'android.intent.action.MAIN' in manifest
              assert 'de.robv.android.xposed.category.MODULE_SETTINGS' in manifest
              assert 'android.intent.category.LAUNCHER' not in manifest
              with zipfile.ZipFile(apk_path) as apk:
                  entry = apk.read('META-INF/xposed/java_init.list').decode().strip()
                  assert entry == 'io.github.takattowo.usercabridge.UserCABridge'
                  properties = apk.read('META-INF/xposed/module.prop').decode()
                  assert 'minApiVersion=102' in properties
                  assert 'staticScope=false' in properties
                  descriptor = b'Lio/github/takattowo/usercabridge/UserCABridge;'
                  dex_files = [apk.read(name) for name in apk.namelist() if name.endswith('.dex')]
                  assert any(descriptor in dex for dex in dex_files)
                  assert any(b'onModuleLoaded' in dex for dex in dex_files)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Rename release APK with version tag
        id: apk
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          metadata_file = Path('app/build/outputs/apk/release/output-metadata.json')
          element = json.loads(metadata_file.read_text())['elements'][0]
          expected_tag = f"{element['versionCode']}-{element['versionName']}"
          tagged = os.environ['GITHUB_REF_TYPE'] == 'tag'
          version = os.environ['GITHUB_REF_NAME'] if tagged else os.environ['GITHUB_SHA'][:7]
          if tagged and version != expected_tag:
              raise SystemExit(f'Tag must match APK version: {expected_tag}')
          destination = Path(os.environ['RUNNER_TEMP']) / 'out' / f'UserCABridge-{version}.apk'
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(metadata_file.parent / element['outputFile'], destination)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={destination}\nname={destination.name}\nversion={version}\n')
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UserCA-Bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
